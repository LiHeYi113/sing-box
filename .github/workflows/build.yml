name: Build Android ARM64 Kernel

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: false
        type: string
  push:
    branches:
      - main-next
      - dev-next

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      # [修改点1] 直接拉取官方仓库的 dev-next 分支，确保是最新 Beta 版
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: sagernet/sing-box
          ref: dev-next
          fetch-depth: 0
          
      - name: Fetch Upstream Tags
        run: |
          git remote add upstream https://github.com/sagernet/sing-box.git
          git fetch upstream --tags
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5
      - name: Check input version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Calculate version (Auto)
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        run: |
          go run -v ./cmd/internal/read_tag --ci --nightly
      - name: Set outputs
        id: outputs
        run: |
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_android_arm64:
    name: Build Android ARM64 Binary
    runs-on: ubuntu-latest
    needs: calculate_version
    env:
      # 包含所有必要的特性 Tags
      BUILD_TAGS: "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0,with_naive_outbound"
      NDK_TOOLCHAIN: "aarch64-linux-android23"
    steps:
      # [修改点2] 同样拉取官方 dev-next 代码进行编译
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: sagernet/sing-box
          ref: dev-next
          fetch-depth: 0
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5
      
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          local-cache: true
      
      - name: Build Binary
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CGO_ENABLED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeuo pipefail
          
          # 1. 安装构建工具
          go install -v ./cmd/internal/build
          
          # --- [依赖准备] NaiveProxy (cronet) ---
          git clone --recursive --depth 1 https://github.com/sagernet/cronet-go.git
          pushd cronet-go
          go run ./cmd/build-naive --target=android/arm64 download-toolchain
          go run ./cmd/build-naive --target=android/arm64 env > ../naive_env.sh
          popd
          grep "CGO_" naive_env.sh > cgo_flags.sh || true
          source cgo_flags.sh
          
          # [关键设置] 使用动态链接 (-lc++) 以支持 NaiveProxy
          export CGO_LDFLAGS="${CGO_LDFLAGS:-} -lc++ -lunwind"
          
          # 设置编译器
          export CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDK_TOOLCHAIN}-clang"
          export CXX="${CC}++"
          
          mkdir -p dist
          
          # 编译命令
          GOOS=android GOARCH=arm64 build go build -v -trimpath \
            -o dist/libsingbox.so \
            -tags "${BUILD_TAGS}" \
            -ldflags "-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }} -checklinkname=0" \
            ./cmd/sing-box
            
          # 重命名
          mv dist/libsingbox.so dist/sing-box
          
          # [自动化] 提取 libc++_shared.so 库文件
          echo "Extracting libc++_shared.so..."
          find "${ANDROID_NDK_HOME}" -name "libc++_shared.so" | grep "aarch64" | head -n 1 | xargs -I {} cp {} dist/
          
          ls -l dist/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: dist/
